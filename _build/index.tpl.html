<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 교실 (by.똑지나쌤)</title>
<meta name="description" content="똑지나쌤이 직접 만든 초등 수업용 웹앱 모음">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --bg:#fbf7f1; --surface:#ffffff; --ink:#2f2723; --muted:#7a6c62; --line:#ebe2d6;
  --accent:#e2683c; --accent-soft:#fde9df;
  --c-social:#d98a1f; --c-korean:#e2683c; --c-math:#3d7bd9; --c-science:#2f9e6e;
  --c-arts:#9a5fd0; --c-career:#d4537e; --c-life:#4a9bb0; --c-tool:#6f7f8f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d1916; --surface:#27221e; --ink:#f3ece4; --muted:#b3a597; --line:#3a332d;
    --accent:#f08a5d; --accent-soft:#3b2a22;
  }
}
:root[data-theme="dark"]{
  --bg:#1d1916; --surface:#27221e; --ink:#f3ece4; --muted:#b3a597; --line:#3a332d;
  --accent:#f08a5d; --accent-soft:#3b2a22;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header.hero{padding-top:48px;padding-bottom:28px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{margin:0;font-size:clamp(30px,6vw,46px);letter-spacing:-.02em;font-weight:800}
.brand .by{font-size:16px;color:var(--muted);font-weight:600}
.lead{margin:10px 0 0;color:var(--muted);font-size:17px;max-width:620px}
.stats{display:flex;gap:18px;margin-top:18px;color:var(--muted);font-size:14px;flex-wrap:wrap}
.stats b{color:var(--ink);font-size:18px}
.controls{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line)}
.search{width:100%;font:inherit;font-size:16px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);outline:none}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:14px;font-weight:600;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
section.subject{padding:28px 0 6px}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.shead h2{margin:0;font-size:22px;letter-spacing:-.01em}
.dot{width:12px;height:12px;border-radius:4px;background:var(--c)}
.shead .count{color:var(--muted);font-size:14px}
.shead .intro{margin-left:auto;font-size:14px;color:var(--muted);text-decoration:none;border-bottom:1px dashed var(--muted)}
.shead .intro:hover{color:var(--accent);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;gap:6px;padding:16px 16px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;text-decoration:none;transition:transform .12s ease,box-shadow .12s ease,border-color .12s}
.card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(60,40,20,.10);border-color:var(--c)}
.card .tag{font-size:12px;font-weight:700;color:var(--c)}
.card h3{margin:0;font-size:17px;line-height:1.35;letter-spacing:-.01em}
.card p{margin:0;font-size:14px;color:var(--muted)}
.card .note{margin-top:auto;padding-top:6px;font-size:12px;color:var(--muted)}
.card .note span{background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:6px;font-weight:600}
.card .ext{font-size:12px;color:var(--muted)}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
footer{margin:40px 0 0;padding:24px 0 40px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.theme{float:right;font:inherit;font-size:13px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:4px 10px;cursor:pointer}
</style>
</head>
<body>
<header class="hero wrap">
  <div class="brand"><h1>오늘의 교실</h1><span class="by">by.똑지나쌤</span></div>
  <p class="lead">교실에서 바로 열어 쓰는 수업용 웹앱 모음이에요. 과목을 고르거나 찾고 싶은 활동을 검색해 보세요.</p>
  <div class="stats" id="stats"></div>
</header>

<div class="controls">
  <div class="wrap">
    <input class="search" id="q" type="search" placeholder="활동 이름이나 주제로 찾기 (예: 독립운동가, 토의, 속력)" aria-label="활동 검색">
    <div class="chips" id="chips" role="group" aria-label="과목 고르기"></div>
  </div>
</div>

<main class="wrap" id="list"></main>

<footer class="wrap">
  <button class="theme" id="theme" type="button">화면 밝기 바꾸기</button>
  © 똑지나쌤 · 오늘의 교실. 수업 자료는 교육용으로 자유롭게 활용해 주세요.
</footer>

<script>
const DATA = /*DATA*/null;
const SUBJECTS = [
  {key:"사회", color:"var(--c-social)"},
  {key:"국어·글쓰기", color:"var(--c-korean)"},
  {key:"수학", color:"var(--c-math)"},
  {key:"과학", color:"var(--c-science)"},
  {key:"예체능", color:"var(--c-arts)"},
  {key:"창체·진로", color:"var(--c-career)"},
  {key:"생활·인성", color:"var(--c-life)"},
  {key:"수업도구", color:"var(--c-tool)"},
];
const all = [...DATA.items, ...DATA.links];
let current = "전체";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("#stats").innerHTML = `<span><b>${DATA.items.length}</b> 개 웹앱</span><span><b>${DATA.links.length}</b> 개 바로가기</span><span><b>${SUBJECTS.length}</b> 개 영역</span>`;

function chips(){
  const keys = ["전체", ...SUBJECTS.map(s=>s.key)];
  $("#chips").innerHTML = keys.map(k=>`<button class="chip" type="button" aria-pressed="${k===current}" data-k="${esc(k)}">${esc(k)}</button>`).join("");
  $("#chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{current=b.dataset.k;chips();render();});
}
function card(it, color){
  const tag = it.sub ? esc(it.sub) : (it.external ? "바로가기" : esc(it.subject));
  const target = it.external ? ' target="_blank" rel="noopener"' : "";
  return `<a class="card" href="${esc(it.url)}"${target} style="--c:${color}">
    <span class="tag">${tag}</span>
    <h3>${esc(it.title)}</h3>
    <p>${esc(it.desc)}</p>
    ${it.note ? `<div class="note"><span>${esc(it.note)}</span></div>` : ""}
    ${it.external ? `<div class="ext">↗ 새 창에서 열려요</div>` : ""}
  </a>`;
}
function render(){
  const q = $("#q").value.trim().toLowerCase();
  const match = it => !q || [it.title,it.desc,it.sub,it.subject].join(" ").toLowerCase().includes(q);
  let html = "";
  for (const s of SUBJECTS){
    if (current!=="전체" && current!==s.key) continue;
    const list = all.filter(it=>it.subject===s.key && match(it));
    if (!list.length) continue;
    const intro = DATA.intros[s.key] && !q ? `<a class="intro" href="${DATA.intros[s.key]}">이 영역 소개 보기</a>` : "";
    html += `<section class="subject"><div class="shead"><span class="dot" style="--c:${s.color}"></span><h2>${esc(s.key)}</h2><span class="count">${list.length}</span>${intro}</div>
      <div class="grid">${list.map(it=>card(it,s.color)).join("")}</div></section>`;
  }
  $("#list").innerHTML = html || `<p class="empty">찾는 활동이 없어요. 다른 낱말로 검색해 보세요.</p>`;
}
$("#q").addEventListener("input", render);
$("#theme").onclick = () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
  try{ localStorage.setItem("oc-theme", r.dataset.theme); }catch(e){}
};
try{ const t = localStorage.getItem("oc-theme"); if (t) document.documentElement.dataset.theme = t; }catch(e){}
chips(); render();
</script>
</body>
</html>
