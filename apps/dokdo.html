                                    <button 
                                        onClick={() => setCurrentStage(prev => prev + 1)}
                                        className="bg-slate-800 text-white px-6 py-3 rounded-full font-bold hover:bg-slate-700 transition-all hover:scale-105 active:scale-95 shadow-lg"
                                    >
                                        다음 미션으로 가기 👉
                                    </button>
                                ) : (
                                    <button 
                                        onClick={() => setShowAdmin(!showAdmin)}
                                        className="bg-indigo-500 text-white px-6 py-3 rounded-full font-bold hover:bg-indigo-600 transition-all hover:scale-105 active:scale-95 shadow-lg flex items-center gap-2 mx-auto"
                                    >
                                        <Icons.Lock className="w-4 h-4" /> 정답 확인소 (선생님용)
                                    </button>
                                )}
                            </div>
                        </div>

                        {/* Secret Admin Panel */}
                        {showAdmin && (
                            <div className="bg-indigo-900 rounded-3xl shadow-xl p-6 text-white animate-in slide-in-from-bottom-5 fade-in duration-300 border-4 border-indigo-300">
                                <div className="text-center mb-6">
                                    <h3 className="text-xl font-bold flex items-center justify-center gap-2 mb-2">
                                        🔐 시크릿 정답 확인소
                                    </h3>
                                    <p className="text-indigo-200 text-sm">
                                        너무 어려워서 도저히 모르겠나요? <br/>
                                        선생님이 알려주신 비밀번호를 입력하면 정답이 열려요!
                                    </p>
                                </div>

                                {!isUnlocked ? (
                                <div className="max-w-xs mx-auto flex gap-2">
                                    <input 
                                        type="password" 
                                        placeholder="비밀번호 4자리" 
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        className="flex-1 px-4 py-2 rounded-xl text-slate-800 font-bold text-center focus:outline-none focus:ring-4 focus:ring-yellow-400"
                                        maxLength={4}
                                    />
                                    <button 
                                        onClick={handlePasswordCheck}
                                        className="bg-yellow-400 text-yellow-900 font-bold px-4 py-2 rounded-xl hover:bg-yellow-300 transition-colors"
                                    >
                                        확인
                                    </button>
                                </div>
                                ) : (
                                <div className="bg-white/10 rounded-xl p-4 md:p-6 backdrop-blur-sm max-h-[400px] overflow-y-auto custom-scrollbar">
                                    <div className="flex items-center justify-between mb-4 border-b border-white/20 pb-2">
                                        <span className="font-bold text-yellow-300 flex items-center gap-2">
                                            <Icons.Unlock className="w-5 h-5" /> 정답 공개
                                        </span>
                                        <button onClick={() => {setIsUnlocked(false); setPassword('');}} className="text-xs text-indigo-300 hover:text-white underline">다시 잠그기</button>
                                    </div>
                                    <div className="space-y-6">
                                    {stages.map((stage) => (
                                        <div key={stage.id} className="text-left">
                                            <h4 className="font-bold text-indigo-200 mb-2 border-l-4 border-yellow-400 pl-2">{stage.title}</h4>
                                            <ul className="space-y-1 text-sm pl-4">
                                                {stage.questions.map((q, i) => (
                                                <li key={i} className="flex gap-2">
                                                    <span className="text-indigo-400 font-bold">{i+1}.</span>
                                                    <span>{q.answer}</span>
                                                </li>
                                                ))}
                                            </ul>
                                        </div>
                                    ))}
                                    </div>
                                </div>
                                )}
                            </div>
                        )}

                        {/* Reliable Sites Footer */}
                        <section className="mt-12">
                            <h3 className="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2 px-2">
                                <Icons.Heart className="w-5 h-5 text-red-500 fill-red-500 animate-pulse" />
                                독도, 더 알아볼까요? (추천 사이트)
                            </h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {resources.map((site, idx) => (
                                    <a 
                                        key={idx}
                                        href={site.url}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="flex items-center gap-3 p-4 bg-white rounded-2xl shadow-sm hover:shadow-md hover:scale-[1.02] transition-all group border border-slate-100"
                                    >
                                        <div className="bg-blue-50 p-2.5 rounded-xl group-hover:bg-blue-500 group-hover:text-white transition-colors text-blue-500">
                                            <Icons.ExternalLink className="w-5 h-5" />
                                        </div>
                                        <div>
                                            <h4 className="font-bold text-slate-700 group-hover:text-blue-600 transition-colors">
                                                {site.name}
                                            </h4>
                                            <p className="text-xs text-slate-400 mt-0.5">{site.desc}</p>
                                        </div>
                                    </a>
                                ))}
                            </div>
                        </section>

                        <footer className="text-center text-slate-400 text-xs py-10">
                            <p className="mb-2">대한민국 아름다운 영토, 독도 🇰🇷</p>
                            <p>© 2024 독도 사랑 교육 연구소</p>
                        </footer>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DokdoApp />);
    </script>
