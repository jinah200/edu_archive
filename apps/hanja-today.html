<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 한자</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding&family=Poor+Story&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poor Story', cursive;
            background-color: #f0f9ff; /* 매우 밝은 하늘색 배경 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
            overflow-x: hidden; /* 가로 스크롤 방지 */
        }
        .hanja-card {
            background-color: #ffffff;
            border-radius: 20px; /* 더 둥근 모서리 */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            padding: 2rem; /* 내부 패딩 증가 */
            text-align: center;
            width: 100%;
            max-width: 500px; /* 카드 최대 너비 설정 */
            border: 5px solid #60a5fa; /* 파란색 테두리 */
            position: relative; /* 장식 요소를 위한 기준점 */
            margin-top: 2rem; /* 이미지 삭제 후 상단 여백 추가 */
        }
        .hanja-character {
            font-family: 'Nanum Gothic Coding', monospace;
            font-size: 5rem; /* 한자 크기 증가 */
            color: #1e3a8a; /* 진한 파란색 */
            margin-bottom: 1rem;
            font-weight: bold;
        }
        .hanja-details {
            font-size: 1.5rem; /* 뜻과 음 크기 증가 */
            color: #1d4ed8; /* 중간 파란색 */
            margin-bottom: 0.5rem;
            word-break: keep-all; /* 단어 단위 줄바꿈 */
        }
        .hanja-meaning {
            font-size: 1.2rem; /* 뜻 설명 크기 증가 */
            color: #3b82f6; /* 밝은 파란색 */
            margin-bottom: 1.5rem;
        }
        .sentence-box {
            background-color: #e0f2fe; /* 밝은 하늘색 배경의 예문 박스 */
            border-radius: 15px; /* 예문 박스 둥근 모서리 */
            padding: 1.5rem; /* 예문 박스 내부 패딩 */
            margin-top: 1.5rem;
            font-size: 1.3rem; /* 예문 폰트 크기 증가 */
            color: #0c4a6e; /* 어두운 하늘색 계열 텍스트 */
            border: 2px dashed #93c5fd; /* 점선 테두리 */
            text-align: left; /* 예문은 왼쪽 정렬 */
        }
        .sentence-box strong {
            color: #1e40af; /* 예문 속 한자 강조색 */
        }
        /* header-image 스타일은 삭제됨 */
        .decoration {
            position: absolute;
            font-size: 2rem;
            opacity: 0.6;
        }
        .deco1 { top: 20px; left: 20px; transform: rotate(-15deg); }
        .deco2 { top: 30px; right: 30px; transform: rotate(15deg); }
        .deco3 { bottom: 20px; left: 30px; transform: rotate(10deg); }
        .deco4 { bottom: 30px; right: 20px; transform: rotate(-10deg); }

        /* 작은 화면에서의 폰트 크기 조정 */
        @media (max-width: 640px) {
            .hanja-character {
                font-size: 4rem;
            }
            .hanja-details {
                font-size: 1.2rem; /* 작은 화면에서 발음 부분 폰트 약간 줄임 */
            }
            .hanja-meaning {
                font-size: 1.1rem;
            }
            .sentence-box {
                font-size: 1.1rem;
                padding: 1rem;
            }
            .hanja-card {
                padding: 1.5rem;
            }
            /* header-image 스타일은 삭제됨 */
        }
    </style>
</head>
<body>
    <div class="hanja-card">
        <span class="decoration deco1">🌟</span>
        <span class="decoration deco2">✨</span>
        <span class="decoration deco3">💡</span>
        <span class="decoration deco4">📖</span>

        <h1 class="text-3xl font-bold text-blue-700 mb-6 mt-4">오늘의 한자 ☀️</h1> <div id="hanja-word-display">
            <div class="hanja-character" id="hanja-char"></div>
            <div class="hanja-details" id="hanja-pronunciation"></div>
            <div class="hanja-meaning" id="hanja-meaning-text"></div>
            <div class="sentence-box">
                <p>📖 <span class="font-semibold">예문:</span> <span id="hanja-sentence"></span></p>
            </div>
        </div>
        <button id="new-word-button" class="mt-8 bg-blue-500 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg text-lg shadow-md transition duration-150 ease-in-out transform hover:scale-105">
            다른 단어 보기 🔄
        </button>
    </div>

    <script>
        // 한자 단어 데이터 배열
        const hanjaWords = [
            { hanja: "學校", pronunciation: "학교", meaningText: "배울 학, 학교 교", sentence: "나는 매일 아침 <strong>學校</strong>에 갑니다." },
            { hanja: "父母", pronunciation: "부모", meaningText: "아버지 부, 어머니 모", sentence: "<strong>父母</strong>님께 항상 감사하는 마음을 가져야 합니다." },
            { hanja: "友情", pronunciation: "우정", meaningText: "벗 우, 뜻 정", sentence: "진정한 <strong>友情</strong>은 무엇과도 바꿀 수 없습니다." },
            { hanja: "努力", pronunciation: "노력", meaningText: "힘쓸 노, 힘 력", sentence: "꾸준한 <strong>努力</strong>만이 성공의 길입니다." },
            { hanja: "讀書", pronunciation: "독서", meaningText: "읽을 독, 글 서", sentence: "매일 <strong>讀書</strong>하는 습관은 매우 중요합니다." },
            { hanja: "親舊", pronunciation: "친구", meaningText: "친할 친, 옛 구", sentence: "나에게는 아주 좋은 <strong>親舊</strong>가 있습니다." },
            { hanja: "先生", pronunciation: "선생", meaningText: "먼저 선, 날 생", sentence: "<strong>先生</strong>님은 우리에게 많은 것을 가르쳐 주십니다." },
            { hanja: "時間", pronunciation: "시간", meaningText: "때 시, 사이 간", sentence: "<strong>時間</strong>은 금이라는 말이 있습니다." },
            { hanja: "運動", pronunciation: "운동", meaningText: "옮길 운, 움직일 동", sentence: "건강을 위해 매일 <strong>運動</strong>을 합시다." },
            { hanja: "感謝", pronunciation: "감사", meaningText: "느낄 감, 사례할 사", sentence: "작은 것에도 <strong>感謝</strong>하는 마음을 가지세요." },
            { hanja: "幸福", pronunciation: "행복", meaningText: "다행 행, 복 복", sentence: "모두가 <strong>幸福</strong>한 세상을 꿈꿉니다." },
            { hanja: "愛國", pronunciation: "애국", meaningText: "사랑 애, 나라 국", sentence: "<strong>愛國</strong>하는 마음은 나라 발전의 밑거름입니다." },
            { hanja: "自然", pronunciation: "자연", meaningText: "스스로 자, 그럴 연", sentence: "아름다운 <strong>自然</strong>을 보호해야 합니다." },
            { hanja: "家族", pronunciation: "가족", meaningText: "집 가, 겨레 족", sentence: "우리 <strong>家族</strong>은 서로 사랑하며 지냅니다." },
            { hanja: "平和", pronunciation: "평화", meaningText: "평평할 평, 화할 화", sentence: "세계 <strong>平和</strong>를 위해 모두 노력해야 합니다." }
        ];

        // HTML 요소 가져오기
        const hanjaCharElem = document.getElementById('hanja-char');
        const hanjaPronunciationElem = document.getElementById('hanja-pronunciation');
        const hanjaMeaningTextElem = document.getElementById('hanja-meaning-text');
        const hanjaSentenceElem = document.getElementById('hanja-sentence');
        const newWordButton = document.getElementById('new-word-button');

        let currentWordIndex = 0; // 현재 표시된 단어의 인덱스

        // 한 글자의 음을 가져오는 함수 (데이터 구조가 각 한자별 음을 포함하지 않으므로, 단어의 발음에서 추정)
        function getHanjaSound(char, currentWordData) {
            const charIndex = currentWordData.hanja.indexOf(char);
            // 한자 문자열과 발음 문자열의 길이가 같다고 가정하고 각 문자에 해당하는 발음을 매칭
            if (charIndex !== -1 && currentWordData.pronunciation.length === currentWordData.hanja.length) {
                 return currentWordData.pronunciation[charIndex];
            }
            return '?'; // 매칭되는 음을 찾지 못하면 물음표 반환
        }

        // 오늘의 단어를 표시하는 함수
        function displayWord(index) {
            if (index < 0 || index >= hanjaWords.length) {
                console.error("유효하지 않은 인덱스입니다:", index);
                // 기본 단어 표시 또는 오류 메시지
                hanjaCharElem.textContent = "오류";
                hanjaPronunciationElem.textContent = "단어를 불러올 수 없습니다.";
                hanjaMeaningTextElem.textContent = "";
                hanjaSentenceElem.textContent = "";
                return;
            }
            const word = hanjaWords[index];
            hanjaCharElem.textContent = word.hanja;

            // 각 한자 글자와 그에 해당하는 음을 표시
            // 예: 학교 (學(학), 校(교))
            const pronunciationDetails = word.hanja.split('').map(char => {
                const sound = getHanjaSound(char, word);
                return `${char}(${sound})`;
            }).join(', ');
            hanjaPronunciationElem.textContent = `${word.pronunciation} (${pronunciationDetails})`;
            
            hanjaMeaningTextElem.textContent = `뜻: ${word.meaningText}`;
            hanjaSentenceElem.innerHTML = word.sentence; // innerHTML을 사용하여 strong 태그 적용
        }
        
        // "다른 단어 보기" 버튼 클릭 시 랜덤으로 다른 단어를 보여주는 함수
        function showNewWord() {
            let newIndex;
            if (hanjaWords.length <= 1) {
                newIndex = 0; // 단어가 하나뿐이면 항상 그 단어 표시
            } else {
                // 이전에 보여준 단어와 다른 단어를 선택하도록 함
                do {
                    newIndex = Math.floor(Math.random() * hanjaWords.length);
                } while (newIndex === currentWordIndex);
            }
            currentWordIndex = newIndex;
            displayWord(currentWordIndex);
        }
        
        // "다른 단어 보기" 버튼 이벤트 리스너
        newWordButton.addEventListener('click', showNewWord);

        // 페이지가 처음 로드될 때 실행: 날짜 기반으로 오늘의 단어 선택
        function showDailyWord() {
            const today = new Date();
            const dayOfMonth = today.getDate(); // 현재 날짜 (1~31)
            // 날짜를 기반으로 인덱스 계산 (0부터 시작하도록 -1)
            // 단어 목록 길이로 나눈 나머지를 사용하여 목록 내에서 순환하도록 함
            currentWordIndex = (dayOfMonth - 1) % hanjaWords.length; 
            displayWord(currentWordIndex);
        }

        // 초기 단어 표시 (매일 다른 단어)
        showDailyWord();

    </script>

<!-- 오늘의 교실: 홈 버튼 -->
<a href="../index.html" id="oc-home" title="오늘의 교실 홈으로" style="position:fixed;left:12px;bottom:12px;z-index:2147483647;background:#fff;color:#3b2f2a;border:1px solid #e6dccf;border-radius:999px;padding:8px 14px;font:600 13px/1 system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.12)">🏠 오늘의 교실</a>
<style>@media print{#oc-home{display:none!important}}</style>
</body>
</html>
