<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>역사 인물 탐구</title>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f0f4f8;
        }
        .font-jua {
            font-family: 'Jua', sans-serif;
        }
        .card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .scroll-hide::-webkit-scrollbar {
            display: none;
        }
        .scroll-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // 아이콘 컴포넌트들 (SVG)
        const SearchIcon = ({ size = 20, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        );
        const UserIcon = ({ size = 20, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        );
        const StarIcon = ({ size = 20, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        );
        const HistoryIcon = ({ size = 20, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg>
        );
        const ExternalLinkIcon = ({ size = 20, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        );

        // 데이터
        const figuresData = [
            {
                period: "삼국 시대 ~ 통일 신라",
                themeColor: "orange",
                bgClass: "bg-orange-50",
                borderClass: "border-orange-200",
                textClass: "text-orange-900",
                badgeClass: "bg-orange-100 text-orange-700",
                buttonClass: "bg-orange-500 hover:bg-orange-600 shadow-orange-200",
                figures: [
                    {
                        name: "광개토대왕",
                        life: "고구려의 제19대 왕으로, 18세에 왕이 되어 영토를 크게 넓혔습니다.",
                        achievements: ["한강 이북 차지", "신라 침입 왜구 격퇴", "만주 영토 확장", "연호 '영락' 사용"]
                    },
                    {
                        name: "장수왕",
                        life: "광개토대왕의 아들로 98세까지 장수하며 전성기를 이끌었습니다.",
                        achievements: ["평양성 천도", "남진 정책 추진", "백제 한성 함락", "중원 고구려비"]
                    },
                    {
                        name: "진흥왕",
                        life: "신라의 제24대 왕으로, 화랑도를 개편하고 영토를 확장했습니다.",
                        achievements: ["화랑도 개편", "한강 유역 차지", "대가야 정복", "순수비 건립"]
                    },
                    {
                        name: "선덕여왕",
                        life: "우리 역사상 최초의 여왕으로, 어려운 상황에서 나라를 지켰습니다.",
                        achievements: ["첨성대 건립", "황룡사 9층 목탑", "김유신/김춘추 등용", "삼국 통일 기틀"]
                    }
                ]
            },
            {
                period: "고려 시대",
                themeColor: "emerald",
                bgClass: "bg-emerald-50",
                borderClass: "border-emerald-200",
                textClass: "text-emerald-900",
                badgeClass: "bg-emerald-100 text-emerald-700",
                buttonClass: "bg-emerald-600 hover:bg-emerald-700 shadow-emerald-200",
                figures: [
                    {
                        name: "왕건",
                        life: "고려의 건국 시조(태조)입니다. 후삼국을 통일했습니다.",
                        achievements: ["고려 건국", "후삼국 통일", "북진 정책", "훈요 10조"]
                    },
                    {
                        name: "서희",
                        life: "뛰어난 외교 술책으로 싸우지 않고 거란을 물러나게 했습니다.",
                        achievements: ["거란과 외교 담판", "강동 6주 획득", "실리 외교"]
                    },
                    {
                        name: "강감찬",
                        life: "귀주에서 거란군을 크게 물리친 고려의 명장입니다.",
                        achievements: ["귀주 대첩 승리", "거란군 격퇴", "나성 축조 건의"]
                    },
                    {
                        name: "정몽주",
                        life: "고려의 마지막 충신으로, 끝까지 고려를 지키려 했습니다.",
                        achievements: ["성리학 연구", "동방이학의 조", "단심가(충절)"]
                    }
                ]
            },
            {
                period: "조선 시대",
                themeColor: "blue",
                bgClass: "bg-blue-50",
                borderClass: "border-blue-200",
                textClass: "text-blue-900",
                badgeClass: "bg-blue-100 text-blue-700",
                buttonClass: "bg-blue-600 hover:bg-blue-700 shadow-blue-200",
                figures: [
                    {
                        name: "정도전",
                        life: "이성계를 도와 조선을 설계하고 건국을 주도했습니다.",
                        achievements: ["조선 건국 주도", "한양 설계", "법전 편찬", "유교 이념 확립"]
                    },
                    {
                        name: "이성계",
                        life: "조선의 제1대 왕(태조)으로, 위화도 회군 후 조선을 세웠습니다.",
                        achievements: ["조선 건국", "한양 천도", "농지 개혁"]
                    },
                    {
                        name: "세종대왕",
                        life: "한글을 창제하고 과학을 발전시킨 조선 최고의 성군입니다.",
                        achievements: ["훈민정음 창제", "측우기/자격루 발명", "4군 6진 개척", "집현전"]
                    },
                    {
                        name: "신사임당",
                        life: "뛰어난 예술가이자 율곡 이이의 어머니입니다.",
                        achievements: ["초충도 등 그림", "시와 글씨 능통", "현모양처의 상징"]
                    },
                    {
                        name: "이순신",
                        life: "임진왜란 때 거북선과 뛰어난 전술로 바다를 지켰습니다.",
                        achievements: ["거북선 건조", "한산도/명량 대첩", "난중일기", "불패의 신화"]
                    },
                    {
                        name: "곽재우",
                        life: "붉은 옷을 입고 싸운 최초의 의병장 '홍의장군'입니다.",
                        achievements: ["최초 의병 봉기", "게릴라 전술", "의령/창녕 방어"]
                    },
                    {
                        name: "권율",
                        life: "행주산성에서 아녀자들까지 힘을 합쳐 왜군을 물리쳤습니다.",
                        achievements: ["행주 대첩", "이치 대첩", "육군 총지휘(도원수)"]
                    }
                ]
            }
        ];

        function App() {
            const [activeTab, setActiveTab] = React.useState("전체");

            const handleSearch = (name) => {
                const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(name)}`;
                window.open(searchUrl, '_blank');
            };

            const allPeriods = ["전체", ...figuresData.map(d => d.period)];

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-7xl mx-auto">
                    {/* 헤더 */}
                    <header className="text-center mb-10 bg-white rounded-3xl p-8 shadow-lg border-b-4 border-slate-200 relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-orange-400 via-emerald-400 to-blue-400"></div>
                        <div className="inline-flex items-center justify-center p-3 bg-slate-100 rounded-full mb-4">
                            <HistoryIcon size={32} className="text-slate-700" />
                        </div>
                        <h1 className="text-3xl md:text-5xl font-bold text-slate-800 mb-3 font-jua tracking-wider">
                            역사 인물 탐구 학습터
                        </h1>
                        <p className="text-slate-500 font-medium">
                            궁금한 인물을 클릭하여 <span className="text-blue-600 font-bold inline-flex items-center"><SearchIcon size={16} className="mx-1"/>구글 검색</span>으로 떠나보세요!
                        </p>
                    </header>

                    {/* 탭 네비게이션 */}
                    <nav className="flex flex-wrap justify-center gap-3 mb-12">
                        {allPeriods.map((period) => (
                            <button
                                key={period}
                                onClick={() => setActiveTab(period)}
                                className={`px-6 py-3 rounded-full font-bold text-lg transition-all duration-300 font-jua shadow-sm ${
                                    activeTab === period
                                        ? "bg-slate-800 text-white shadow-lg scale-105 transform ring-2 ring-slate-300 ring-offset-2"
                                        : "bg-white text-slate-500 hover:bg-slate-100 hover:text-slate-700 border border-slate-200"
                                }`}
                            >
                                {period}
                            </button>
                        ))}
                    </nav>

                    {/* 메인 컨텐츠 */}
                    <main className="space-y-16">
                        {figuresData.map((era, eraIndex) => (
                            (activeTab === "전체" || activeTab === era.period) && (
                                <section key={eraIndex} className="animate-fade-in">
                                    <div className="flex items-center gap-3 mb-6 px-2">
                                        <div className={`w-2 h-8 rounded-full ${era.badgeClass.replace('text-', 'bg-').split(' ')[0]}`}></div>
                                        <h2 className={`text-2xl md:text-3xl font-bold ${era.textClass} font-jua`}>{era.period}</h2>
                                    </div>
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                        {era.figures.map((figure, fIndex) => (
                                            <div 
                                                key={fIndex} 
                                                onClick={() => handleSearch(figure.name)}
                                                className={`group bg-white rounded-2xl shadow-md border-2 ${era.borderClass} card-hover transition-all duration-300 cursor-pointer overflow-hidden relative flex flex-col h-full`}
                                            >
                                                {/* 카드 헤더 */}
                                                <div className={`${era.bgClass} p-5 border-b ${era.borderClass} flex justify-between items-center relative z-10`}>
                                                    <h3 className={`text-2xl font-bold ${era.textClass} font-jua group-hover:scale-105 transition-transform origin-left`}>
                                                        {figure.name}
                                                    </h3>
                                                    <div className={`p-2 rounded-full bg-white bg-opacity-60 text-slate-400 group-hover:text-blue-600 group-hover:bg-blue-50 transition-colors`}>
                                                        <SearchIcon size={20} />
                                                    </div>
                                                </div>

                                                {/* 카드 내용 */}
                                                <div className="p-6 flex-1 flex flex-col gap-5 relative z-10 bg-white">
                                                    {/* 생애 */}
                                                    <div>
                                                        <div className="flex items-center gap-2 text-slate-400 mb-2 text-sm font-bold uppercase tracking-wider">
                                                            <UserIcon size={16} />
                                                            <span>생애</span>
                                                        </div>
                                                        <p className="text-slate-600 leading-relaxed text-sm bg-slate-50 p-3 rounded-xl border border-slate-100">
                                                            {figure.life}
                                                        </p>
                                                    </div>

                                                    {/* 업적 */}
                                                    <div className="flex-1">
                                                        <div className="flex items-center gap-2 text-slate-400 mb-2 text-sm font-bold uppercase tracking-wider">
                                                            <StarIcon size={16} />
                                                            <span>주요 업적</span>
                                                        </div>
                                                        <ul className="space-y-2">
                                                            {figure.achievements.map((achieve, aIndex) => (
                                                                <li key={aIndex} className="flex items-start gap-2 text-sm text-slate-700">
                                                                    <span className={`mt-1.5 w-1.5 h-1.5 rounded-full flex-shrink-0 bg-current opacity-60 ${era.textClass}`}></span>
                                                                    <span className="font-medium">{achieve}</span>
                                                                </li>
                                                            ))}
                                                        </ul>
                                                    </div>
                                                </div>

                                                {/* 호버 시 나타나는 검색 안내 오버레이 (모바일 제외) */}
                                                <div className="absolute inset-0 bg-gradient-to-t from-black/5 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none hidden md:block"></div>
                                                <div className="absolute bottom-0 left-0 w-full p-2 text-center transform translate-y-full group-hover:translate-y-0 transition-transform duration-300 hidden md:block">
                                                    <span className={`${era.buttonClass} text-white text-xs font-bold px-4 py-2 rounded-full shadow-lg inline-flex items-center gap-1`}>
                                                        <SearchIcon size={12} />
                                                        클릭하여 검색하기
                                                    </span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </section>
                            )
                        ))}
                    </main>

                    <footer className="mt-20 py-8 text-center text-slate-400 text-sm border-t border-slate-200">
                        <p className="flex items-center justify-center gap-2">
                            <span className="font-jua text-lg">역사 탐구</span> 
                            <span>&copy; 인물 카드를 눌러보세요</span>
                        </p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

<!-- 오늘의 교실: 홈 버튼 -->

<style>@media print{#oc-home{display:none!important}}</style>
</body>
</html>
