<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 동네 법 이야기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(to bottom right, #e0f2fe, #f0f8ff); /* Light blue to very light blue gradient */
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            flex-grow: 1;
        }
        .header {
            background: linear-gradient(to right, #6366f1, #8b5cf6); /* Purple to indigo gradient */
            color: white;
            padding: 30px 20px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 40px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: -50px;
            left: -50px;
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            transform: rotate(45deg);
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -30px;
            right: -30px;
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            transform: rotate(-30deg);
        }
        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        .header p {
            font-size: 1.2rem;
            font-weight: 400;
        }
        .law-card {
            background-color: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out, border-color 0.3s ease-in-out;
            border: 2px solid transparent; /* Initial transparent border */
            display: flex;
            align-items: flex-start;
        }
        .law-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
            border-color: #8b5cf6; /* Highlight border on hover */
        }
        .law-icon {
            font-size: 2.5rem;
            margin-right: 20px;
            color: #6366f1; /* Icon color */
            flex-shrink: 0;
        }
        .law-content-wrapper {
            flex-grow: 1;
        }
        .law-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #2c5282;
            margin-bottom: 10px;
            cursor: pointer; /* Indicate clickable */
            transition: color 0.2s ease-in-out;
        }
        .law-title:hover {
            color: #4a90e2; /* Change color on hover */
        }
        .law-purpose {
            font-size: 1.05rem;
            color: #555;
            line-height: 1.7;
            margin-bottom: 15px;
            cursor: pointer; /* Indicate clickable */
            transition: color 0.2s ease-in-out;
        }
        .law-purpose:hover {
            color: #444; /* Slightly darker on hover */
        }
        .law-detail-content {
            font-size: 1rem;
            color: #666;
            line-height: 1.7;
            display: none; /* Initially hidden */
            padding-top: 10px;
            border-top: 1px dashed #e0e0e0;
            margin-top: 15px;
            cursor: pointer; /* Indicate clickable */
            transition: color 0.2s ease-in-out;
        }
        .law-detail-content:hover {
            color: #555; /* Slightly darker on hover */
        }
        .toggle-button {
            background: linear-gradient(to right, #4a90e2, #667eea); /* Blue to indigo gradient */
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-block;
            margin-top: 20px;
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }
        .toggle-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }
        .footer {
            text-align: center;
            margin-top: 50px;
            padding: 25px;
            color: #777;
            font-size: 0.95rem;
            background-color: #f0f4f8;
            border-top: 1px solid #e0e0e0;
            border-radius: 12px 12px 0 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="text-4xl font-bold mb-2">✨ 우리 동네 법 이야기 ✨</h1>
            <p class="text-lg">초등학교 5학년 친구들을 위한 재미있는 법률 탐험!</p>
        </header>

        <main>
            <!-- 법령 카드 목록 -->
            <div id="law-list" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- 각 법령은 JavaScript로 동적으로 추가됩니다. -->
            </div>
        </main>
    </div>

    <footer class="footer">
        <p>&copy; 2025 우리 동네 법 이야기. 모든 권리 보유.</p>
        <p>참고: 국가법령정보센터 (www.law.go.kr)</p>
    </footer>

        // 법령 목록을 웹페이지에 동적으로 추가하는 함수
        function loadLaws() {
            const lawListDiv = document.getElementById('law-list');
            laws.forEach(law => {
                const lawCard = document.createElement('div');
                lawCard.className = 'law-card';
                lawCard.setAttribute('data-id', law.id);

                lawCard.innerHTML = `
                    <div class="law-icon">${law.icon}</div>
                    <div class="law-content-wrapper">
                        <h2 class="law-title" onclick="searchLawContent('${law.name}')">${law.name}</h2>
                        <p class="law-purpose" onclick="searchLawContent('${law.name} 목적')"><strong>목적:</strong> ${law.purpose}</p>
                        <div id="content-${law.id}" class="law-detail-content" onclick="searchLawContent('${law.name} 내용')">
                            <p><strong>내용:</strong> ${law.content}</p>
                        </div>
                        <button class="toggle-button" onclick="toggleContent('${law.id}')">자세히 보기</button>
                    </div>
                `;
                lawListDiv.appendChild(lawCard);
            });
        }

        // '자세히 보기' 버튼 클릭 시 내용 토글 함수
        function toggleContent(id) {
            const contentDiv = document.getElementById(`content-${id}`);
            const button = contentDiv.nextElementSibling; // Get the button after the content div

            if (contentDiv.style.display === 'none' || contentDiv.style.display === '') {
                contentDiv.style.display = 'block';
                button.textContent = '숨기기';
            } else {
                contentDiv.style.display = 'none';
                button.textContent = '자세히 보기';
            }
        }

        // 텍스트 클릭 시 구글 검색을 수행하는 함수
        function searchLawContent(query) {
            const encodedQuery = encodeURIComponent(query);
            window.open(`https://www.google.com/search?q=${encodedQuery}`, '_blank');
        }

        // 페이지 로드 시 법령 목록 로드
        window.onload = loadLaws;
    </script>
