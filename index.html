"desc": "비빔밥 재료에 우정의 미덕을 적어요. A4 인쇄용.", "note": "", "url": "apps/friendship-bibimbap.html"}], "intros": {"사회": "apps/intro-social.html", "국어·글쓰기": "apps/intro-korean.html", "과학": "apps/intro-science.html", "예체능": "apps/intro-arts.html"}, "links": [{"title": "마음 쉼터", "url": "https://jinah200.github.io/maeum/", "subject": "생활·인성", "desc": "학생 마음 쉼터 (별도 사이트)", "external": true}, {"title": "조선 인물 인터뷰", "url": "https://chosunchat.ai.studio/", "subject": "사회", "desc": "조선 인물과 대화하는 AI 챗봇 (AI Studio)", "external": true}, {"title": "영상 감상 후기 남기기", "url": "https://script.google.com/macros/s/AKfycbzVpkbHAHfl1R-Odlox8WU1hiJsfmSVmwmj5HOfxyWRsr8EUy2mAGMx18B8T0UjRWzsDQ/exec", "subject": "국어·글쓰기", "desc": "구글 Apps Script 웹앱", "external": true}, {"title": "감정 기록기", "url": "https://script.google.com/macros/s/AKfycbwTqKcwQVBOdggMqXejL1V5PqoSBwc3vZ8E36Oj5OJebdfyzcIW1BWkbrfDcVAnG4F-/exec", "subject": "생활·인성", "desc": "구글 Apps Script 웹앱", "external": true}]};
const SUBJECTS = [
  {key:"사회", color:"var(--c-social)"},
  {key:"국어·글쓰기", color:"var(--c-korean)"},
  {key:"수학", color:"var(--c-math)"},
  {key:"과학", color:"var(--c-science)"},
  {key:"예체능", color:"var(--c-arts)"},
  {key:"창체·진로", color:"var(--c-career)"},
  {key:"생활·인성", color:"var(--c-life)"},
  {key:"수업도구", color:"var(--c-tool)"},
];
const all = [...DATA.items, ...DATA.links];
let current = "전체";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("#stats").innerHTML = `<span><b>${DATA.items.length}</b> 개 웹앱</span><span><b>${DATA.links.length}</b> 개 바로가기</span><span><b>${SUBJECTS.length}</b> 개 영역</span>`;

function chips(){
  const keys = ["전체", ...SUBJECTS.map(s=>s.key)];
  $("#chips").innerHTML = keys.map(k=>`<button class="chip" type="button" aria-pressed="${k===current}" data-k="${esc(k)}">${esc(k)}</button>`).join("");
  $("#chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{current=b.dataset.k;chips();render();});
}
function card(it, color){
  const tag = it.sub ? esc(it.sub) : (it.external ? "바로가기" : esc(it.subject));
  const target = it.external ? ' target="_blank" rel="noopener"' : "";
  return `<a class="card" href="${esc(it.url)}"${target} style="--c:${color}">
    <span class="tag">${tag}</span>
    <h3>${esc(it.title)}</h3>
    <p>${esc(it.desc)}</p>
    ${it.note ? `<div class="note"><span>${esc(it.note)}</span></div>` : ""}
    ${it.external ? `<div class="ext">↗ 새 창에서 열려요</div>` : ""}
  </a>`;
}
function render(){
  const q = $("#q").value.trim().toLowerCase();
  const match = it => !q || [it.title,it.desc,it.sub,it.subject].join(" ").toLowerCase().includes(q);
  let html = "";
  for (const s of SUBJECTS){
    if (current!=="전체" && current!==s.key) continue;
    const list = all.filter(it=>it.subject===s.key && match(it));
    if (!list.length) continue;
    const intro = DATA.intros[s.key] && !q ? `<a class="intro" href="${DATA.intros[s.key]}">이 영역 소개 보기</a>` : "";
    html += `<section class="subject"><div class="shead"><span class="dot" style="--c:${s.color}"></span><h2>${esc(s.key)}</h2><span class="count">${list.length}</span>${intro}</div>
      <div class="grid">${list.map(it=>card(it,s.color)).join("")}</div></section>`;
  }
  $("#list").innerHTML = html || `<p class="empty">찾는 활동이 없어요. 다른 낱말로 검색해 보세요.</p>`;
}
$("#q").addEventListener("input", render);
$("#theme").onclick = () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
  try{ localStorage.setItem("oc-theme", r.dataset.theme); }catch(e){}
};
try{ const t = localStorage.getItem("oc-theme"); if (t) document.documentElement.dataset.theme = t; }catch(e){}
chips(); render();
</script>
